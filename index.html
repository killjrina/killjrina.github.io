<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Квиз на тему: промтинг и нейросети</title>
    <style>
        /* ---------- BRUTALIST / RETRO STYLE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f2e8;
            background-image: repeating-linear-gradient(45deg, #e0dcd0 0px, #e0dcd0 2px, transparent 2px, transparent 8px);
            font-family: 'Courier New', 'Fira Code', 'IBM Plex Mono', monospace;
            color: #1f1b13;
            padding: 2rem 1rem;
        }

        /* main container – brutalist box */
        .quiz-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fef7e0;
            border: 4px solid #2c2b26;
            box-shadow: 12px 12px 0 #4a3b2c;
            padding: 1.5rem;
            transition: box-shadow 0.2s ease;
        }

        /* headers */
        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            border-bottom: 5px solid #d94f30;
            display: inline-block;
            margin-bottom: 0.5rem;
            font-weight: 800;
            color: #1f1b13;
            text-shadow: 3px 3px 0 #cfc6af;
        }

        .sub {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            background: #1f1b13;
            color: #fef7e0;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        /* progress bar (brutal) */
        .progress-area {
            background: #e2dcca;
            border: 2px solid #2c2b26;
            padding: 0.4rem;
            margin-bottom: 2rem;
        }

        .progress-bar {
            background: #2c2b26;
            height: 24px;
            width: 0%;
            transition: width 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .counter {
            font-weight: bold;
            font-size: 0.9rem;
            text-align: right;
            margin-top: 0.5rem;
            font-family: monospace;
        }

        /* question card */
        .question-card {
            background: #fffbf0;
            border: 3px solid #2c2b26;
            padding: 1.5rem;
            margin-bottom: 2rem;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .fade-exit {
            opacity: 0;
            transform: translateX(-10px);
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            border-left: 12px solid #d94f30;
            padding-left: 1rem;
        }

        /* options brutalist style */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .option {
            background: #ece4d4;
            border: 2px solid #2c2b26;
            padding: 0.9rem 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.05s linear;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            background: #dbcfb8;
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0 #2c2b26;
        }

        .option.selected {
            background: #2c2b26;
            color: #fef7e0;
            border-color: #d94f30;
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .option-prefix {
            font-weight: 800;
            font-size: 1.3rem;
            width: 32px;
            display: inline-block;
        }

        /* navigation buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin: 2rem 0 1rem;
            gap: 1rem;
        }

        button {
            background: #2c2b26;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.8rem 1.8rem;
            color: #fef7e0;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.1s linear;
            border: 2px solid #d94f30;
            letter-spacing: 1px;
        }

        button:active {
            transform: translate(2px, 2px);
            background: #d94f30;
            border-color: #2c2b26;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 2rem;
            border-top: 4px double #2c2b26;
            padding-top: 1.8rem;
        }

        .score-block {
            background: #2c2b26;
            color: #fef7e0;
            padding: 1rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .download-link {
            display: inline-block;
            background: #d94f30;
            color: #1f1b13;
            text-decoration: none;
            font-weight: 800;
            padding: 1rem 2rem;
            text-align: center;
            border: 3px solid #2c2b26;
            font-size: 1.3rem;
            text-transform: uppercase;
            transition: 0.1s;
            margin-top: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .download-link:hover {
            background: #bf3e21;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #2c2b26;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            text-align: center;
            border-top: 1px solid #c0b69c;
            padding-top: 1rem;
            color: #4a3b2c;
        }

        hr {
            border-top: 3px solid #2c2b26;
            margin: 1rem 0;
        }

        @media (max-width: 680px) {
            .quiz-container {
                padding: 1rem;
            }
            .question-text {
                font-size: 1.2rem;
            }
            button {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizRoot">
    <h1>PROMPT ENGINEERING<br>+ NEURAL NETWORKS</h1>
    <div class="sub">// КВИЗ ПРО НЕЙРОСЕТИ / 15 ВОПРОСОВ</div>

    <div class="progress-area">
        <div class="progress-bar" id="progressFill"></div>
        <div class="counter" id="questionCounter">ВОПРОС 0 / 15</div>
    </div>

    <div id="questionCard" class="question-card">
        <!-- динамически -->
    </div>

    <div class="nav-buttons">
        <button id="prevBtn" disabled>⟨ НАЗАД</button>
        <button id="nextBtn">ДАЛЕЕ ⟩</button>
    </div>

    <div id="resultContainer" style="display: none;"></div>
    <footer>БРУТАЛИЗМ / RETRO COMPUTING // ОТВЕТЫ ФИКСИРУЮТСЯ АВТОМАТИЧЕСКИ</footer>
</div>

<script>
    // ---------- ВОПРОСЫ (15 штук, сложнее среднего) ----------
    const QUESTIONS = [
        { text: "Что такое температурный параметр (temperature) в генеративных языковых моделях?", 
          options: [
              "Степень детерминированности ответа: чем выше, тем более случайными становятся токены", 
              "Количество токенов, которые модель обрабатывает за раз", 
              "Максимальная длина генерируемого ответа", 
              "Параметр, отвечающий за скорость работы GPU"
          ], 
          correct: 0 },
        { text: "Какой метод промптинга подразумевает предоставление модели нескольких примеров ответа до финального запроса?", 
          options: [
              "Zero-shot", 
              "Few-shot", 
              "Chain-of-Thought", 
              "ReAct"
          ], 
          correct: 1 },
        { text: "Какая техника используется, чтобы заставить модель объяснить промежуточные рассуждения перед выдачей финального ответа?", 
          options: [
              "Self-consistency", 
              "Chain-of-Thought (CoT)", 
              "Prompt chaining", 
              "Instruction tuning"
          ], 
          correct: 1 },
        { text: "В контексте LLM, что такое 'галлюцинация' (hallucination)?", 
          options: [
              "Модель генерирует правдоподобные, но фактологически неверные данные", 
              "Отказ модели отвечать на запрос из-за политики безопасности", 
              "Переполнение буфера токенов во время инференса", 
              "Случайная смена языка ответа на середине предложения"
          ], 
          correct: 0 },
        { text: "Какой из подходов позволяет LLM 'искать' информацию в интернете или базе знаний перед ответом?", 
          options: [
              "Fine-tuning", 
              "Retrieval-Augmented Generation (RAG)", 
              "Prompt hashing", 
              "LoRA"
          ], 
          correct: 1 },
        { text: "Что такое 'логиты' (logits) в контексте работы языковой модели?", 
          options: [
              "Нормализованные вероятности следующего токена", 
              "Сырые, ненормализованные оценки (веса) для каждого возможного следующего токена", 
              "Специальные токены, обозначающие начало и конец текста", 
              "Метрика качества генерации BLEU"
          ], 
          correct: 1 },
        { text: "Параметр top-p (nucleus sampling) ограничивает набор токенов...", 
          options: [
              "С фиксированным количеством самых вероятных токенов", 
              "Суммарная вероятность которых не превышает p, выбирая из динамического набора", 
              "Которые содержат определенный корневой суффикс", 
              "Исключая стоп-слова и предлоги"
          ], 
          correct: 1 },
        { text: "Что такое 'системный промпт' (system prompt) в API типа ChatGPT?", 
          options: [
              "Сообщение от пользователя, определяющее стиль и правила поведения модели на всю сессию", 
              "Служебный запрос для отладки нейросети", 
              "Промпт, который модель обязана игнорировать", 
              "Команда для перезагрузки контекста окна"
          ], 
          correct: 0 },
        { text: "Что из перечисленного лучше всего описывает 'one-shot' промптинг?", 
          options: [
              "Запрос без примеров", 
              "Ровно один пример желаемого ответа в промпте", 
              "Только один токен генерируется на выходе", 
              "Модель обучается на одном изображении"
          ], 
          correct: 1 },
        { text: "Какая проблема решается с помощью 'self-consistency' при использовании CoT?", 
          options: [
              "Уменьшение количества галлюцинаций за счет множественных траекторий рассуждений и голосования", 
              "Ускорение генерации за счет кэширования ключей", 
              "Сжатие промпта в эмбеддинги", 
              "Автоматическая маркировка конфиденциальных данных"
          ], 
          correct: 0 },
        { text: "Что такое 'embedding' в контексте нейросетей и RAG?", 
          options: [
              "Векторное представление данных (текста, изображения) в непрерывном пространстве", 
              "Слой dropout для регуляризации", 
              "Метод квантования весов модели", 
              "Функция потерь для LLM"
          ], 
          correct: 0 },
        { text: "Какой паттерн интеграции ИИ предполагает, что один LLM-агент генерирует код, а другой проверяет его на ошибки?", 
          options: [
              "Mixture of Experts (MoE)", 
              "Multi-agent debate / dual-agent review", 
              "Tree-of-Thoughts", 
              "Instruction backpropagation"
          ], 
          correct: 1 },
        { text: "Что означает термин 'prompt injection' с точки зрения безопасности?", 
          options: [
              "Внедрение вредоносных инструкций в пользовательский ввод, переопределяющих исходный системный промпт", 
              "Метод оптимизации запросов для снижения задержек", 
              "Кеширование промптов на сервере", 
              "Легальный способ обрезки контекстного окна"
          ], 
          correct: 0 },
        { text: "Какая метрика лучше всего подходит для оценки точности ответов LLM в закрытой задаче (например, викторина с фактами)?", 
          options: [
              "Perplexity", 
              "BLEU", 
              "ROUGE", 
              "Exact match или F1-score по ключевым фактам"
          ], 
          correct: 3 },
        { text: "Что такое 'агент' (agent) на базе LLM в интеграционных решениях?", 
          options: [
              "Автономная система, которая использует LLM для планирования, вызова инструментов и циклов обратной связи", 
              "Урезанная версия модели для edge-устройств", 
              "Простой чат-бот без памяти", 
              "Архитектура трансформера без внимания"
          ], 
          correct: 0 }
    ];

    // state
    let currentIndex = 0;
    let userAnswers = new Array(QUESTIONS.length).fill(null);  // индекс выбранного варианта (0..3)
    let quizFinished = false;

    // DOM элементы
    const questionCardDiv = document.getElementById('questionCard');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const questionCounterSpan = document.getElementById('questionCounter');
    const resultContainer = document.getElementById('resultContainer');

    // вспомогательные функции
    function updateProgressAndCounter() {
        const answeredCount = userAnswers.filter(a => a !== null).length;
        const percent = (answeredCount / QUESTIONS.length) * 100;
        progressFill.style.width = percent + '%';
        if (currentIndex < QUESTIONS.length) {
            questionCounterSpan.innerText = `ВОПРОС ${currentIndex+1} / ${QUESTIONS.length}  |  ОТВЕЧЕНО: ${answeredCount}`;
        } else {
            questionCounterSpan.innerText = `ЗАВЕРШЕН / ОТВЕЧЕНО: ${answeredCount}`;
        }
    }

    // рендер текущего вопроса
    function renderCurrentQuestion() {
        if (quizFinished) return;
        if (currentIndex >= QUESTIONS.length) {
            finishQuizAndShowResults();
            return;
        }
        const q = QUESTIONS[currentIndex];
        const selectedIdx = userAnswers[currentIndex];
        let optionsHtml = '';
        const prefixes = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            const isSelected = (selectedIdx === idx);
            const selectedClass = isSelected ? 'selected' : '';
            optionsHtml += `
                <div class="option ${selectedClass}" data-opt-index="${idx}">
                    <span class="option-prefix">${prefixes[idx]}</span>
                    <span>${escapeHtml(opt)}</span>
                </div>
            `;
        });

        const html = `
            <div class="question-text">${escapeHtml(q.text)}</div>
            <div class="options-list" id="optionsList">
                ${optionsHtml}
            </div>
        `;
        questionCardDiv.innerHTML = html;
        // вешаем обработчики на option
        const optDivs = document.querySelectorAll('.option');
        optDivs.forEach(optDiv => {
            optDiv.addEventListener('click', (e) => {
                if (quizFinished) return;
                const idx = parseInt(optDiv.dataset.optIndex);
                // сохраняем ответ
                userAnswers[currentIndex] = idx;
                // перерисовываем текущий вопрос, чтобы подсветить выбранный
                renderCurrentQuestion();
                updateProgressAndCounter();
                // после ответа автоматически разблокируется next (кнопка)
            });
        });
        updateProgressAndCounter();
        // управление кнопками
        prevBtn.disabled = (currentIndex === 0);
        // nextBtn не дизейблим, но можно проверить наличие ответа?
        // сделаем некст активным всегда, но можно предупредить если нет ответа (мягкое)
        // стиль: можно переходить без ответа, но в конце подсветим пропуски
    }

    // простая защита от XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // навигация
    function goPrev() {
        if (quizFinished) return;
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
            // небольшая анимация: добавим класс fade, потом уберем
            animateCard();
        }
    }

    function goNext() {
        if (quizFinished) return;
        if (currentIndex < QUESTIONS.length - 1) {
            currentIndex++;
            renderCurrentQuestion();
            animateCard();
        } else if (currentIndex === QUESTIONS.length - 1) {
            // последний вопрос, завершаем квиз
            currentIndex++; // чтобы уйти за пределы
            finishQuizAndShowResults();
        }
    }

    function animateCard() {
        if (!questionCardDiv) return;
        questionCardDiv.style.transition = 'opacity 0.1s, transform 0.15s';
        questionCardDiv.style.opacity = '0.6';
        questionCardDiv.style.transform = 'translateX(6px)';
        setTimeout(() => {
            if (questionCardDiv) {
                questionCardDiv.style.opacity = '1';
                questionCardDiv.style.transform = 'translateX(0)';
            }
        }, 80);
        setTimeout(() => {
            if (questionCardDiv) questionCardDiv.style.transition = '';
        }, 200);
    }

    // подсчёт результатов + генерация PDF (через window.open dataUrl)
    function finishQuizAndShowResults() {
        if (quizFinished) return;
        quizFinished = true;
        // скрываем карточку вопроса и кнопки навигации
        questionCardDiv.style.display = 'none';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        // вычисляем баллы
        let correctCount = 0;
        let detailedResults = [];
        for (let i = 0; i < QUESTIONS.length; i++) {
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice !== null && userChoice === QUESTIONS[i].correct);
            if (isCorrect) correctCount++;
            let userAnswerText = (userChoice !== null) ? QUESTIONS[i].options[userChoice] : 'НЕ ВЫБРАНО';
            let correctAnswerText = QUESTIONS[i].options[QUESTIONS[i].correct];
            detailedResults.push({
                question: QUESTIONS[i].text,
                userAnswer: userAnswerText,
                correctAnswer: correctAnswerText,
                isCorrect: isCorrect,
                userIdx: userChoice
            });
        }
        const scorePercent = Math.round((correctCount / QUESTIONS.length) * 100);
        // отображение результата в DOM
        let resultHtml = `
            <div class="result-area">
                <div class="score-block">
                    РЕЗУЛЬТАТ: ${correctCount} / ${QUESTIONS.length}  (${scorePercent}%)
                </div>
                <p style="margin-bottom: 1rem; font-weight: bold;">// РАЗБОР ОТВЕТОВ</p>
                <div style="max-height: 300px; overflow-y: auto; border: 2px solid #2c2b26; padding: 0.8rem; background: #f3efdf;">
        `;
        for (let i = 0; i < detailedResults.length; i++) {
            const r = detailedResults[i];
            const statusSym = r.isCorrect ? '[+]' : '[-]';
            const colorStyle = r.isCorrect ? 'color: #2b5e2b;' : 'color: #b13e3e;';
            resultHtml += `
                <div style="margin-bottom: 1rem; border-bottom: 1px dashed #bba88a; padding-bottom: 0.6rem;">
                    <strong>${i+1}. ${escapeHtml(r.question)}</strong><br>
                    <span style="${colorStyle}">${statusSym} ВАШ ОТВЕТ: ${escapeHtml(r.userAnswer)}</span><br>
                    <span style="color:#2c2b26;">✓ ВЕРНЫЙ ОТВЕТ: ${escapeHtml(r.correctAnswer)}</span>
                </div>
            `;
        }
        resultHtml += `</div><br><div id="pdfDownloadZone"></div></div>`;
        resultContainer.innerHTML = resultHtml;
        resultContainer.style.display = 'block';

        // создаём ссылку для скачивания PDF через генерацию текстового файла с расширением .pdf (но пользователь получит ссылку на файл PDF, который сформируем через браузерный print? Нет, мы сделаем настоящий PDF с помощью window.print? но задание: получить ссылку на скачивание pdf. 
        // Самый надёжный способ без библиотек: сгенерировать HTML-содержимое для PDF и использовать data:application/octet-stream? Но это не pdf. 
        // Создадим полноценный PDF через jsPDF? Лучше использовать простую генерацию через Blob и предложить скачать .pdf, но это будет просто текст с html разметкой. Чтобы было честно и профессионально — используем библиотеку? Не требуется внешних зависимостей, но условие: ссылка на скачивание файла PDF. Я реализую создание PDF через динамический iframe с печатью "сохранить как PDF"? Это не совсем ссылка.
        // Лучший вариант: использовать jsPDF + html2canvas? Добавлять внешние библиотеки рискованно. Поэтому сделаем генерацию отчёта в виде .html, который пользователь сохранит как .pdf через браузер? Не подходит.
        // Альтернатива: сформируем текстовый отчет с меткой .pdf? но это обман.
        // Реализуем корректный способ: создаём Blob с application/pdf заглушкой, но реально это будет .html. Некрасиво.
        // Более чистый подход: использовать браузерный print стилей для PDF, и предоставить инструкцию "сохранить как PDF"? Не ссылка.
        // По условию: участник должен получить ссылку на скачивание файла pdf. Я сделаю генерацию файла .pdf через динамическое создание PDF из HTML с помощью загрузки библиотеки? Но библиотека может не загрузиться офлайн.
        // Гарантированное решение: создадим серверную имитацию? В рамках локального HTML — можно сгенерировать data:application/pdf текст, но браузер не распознает его как валидный PDF.
        // Поэтому самое безопасное — встроим библиотеку CDN jsPDF. Я добавлю её, она лёгкая, и сделаю честный PDF с результатами. Это надёжно и соответствует требованиям.
        // Добавим скрипт jsPDF и сформируем кнопку скачивания.
        if (typeof window.jspdf !== 'undefined' && window.jspdf.jsPDF) {
            generatePdfWithJsPDF(detailedResults, correctCount, QUESTIONS.length, scorePercent);
        } else {
            // подгрузим библиотеку динамически
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
            script.onload = () => {
                generatePdfWithJsPDF(detailedResults, correctCount, QUESTIONS.length, scorePercent);
            };
            document.head.appendChild(script);
        }
    }

    function generatePdfWithJsPDF(details, correct, total, percent) {
        // дожидаемся, когда jspdf глобально доступен
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        let y = 20;
        doc.setFont("courier", "normal");
        doc.setFontSize(16);
        doc.text("КВИЗ: ПРОМПТИНГ И НЕЙРОСЕТИ", 20, y);
        y += 10;
        doc.setFontSize(12);
        doc.text(`Результат: ${correct} из ${total} (${percent}%)`, 20, y);
        y += 8;
        doc.setFontSize(10);
        for (let i = 0; i < details.length; i++) {
            const q = details[i];
            const prefix = q.isCorrect ? "+ " : "- ";
            const questionShort = q.question.length > 70 ? q.question.substring(0, 67) + "..." : q.question;
            doc.text(`${prefix}${i+1}. ${questionShort}`, 20, y);
            y += 6;
            doc.text(`   Ваш ответ: ${q.userAnswer.substring(0, 60)}`, 22, y);
            y += 5;
            doc.text(`   Верный: ${q.correctAnswer.substring(0, 60)}`, 22, y);
            y += 7;
            if (y > 270) {
                doc.addPage();
                y = 20;
            }
        }
        doc.text("--- ОТЧЕТ СГЕНЕРИРОВАН АВТОМАТИЧЕСКИ ---", 20, y+8);
        // создаём ссылку для скачивания
        const pdfBlob = doc.output('blob');
        const url = URL.createObjectURL(pdfBlob);
        const downloadLink = document.createElement('a');
        downloadLink.href = url;
        downloadLink.download = 'quiz_prompt_engineering_results.pdf';
        downloadLink.className = 'download-link';
        downloadLink.innerText = 'СКАЧАТЬ РЕЗУЛЬТАТ (PDF)';
        const container = document.getElementById('pdfDownloadZone');
        if (container) {
            container.innerHTML = '';
            container.appendChild(downloadLink);
        }
        URL.revokeObjectURL(url); // не сразу, но ссылка жива
    }

    // на случай, если библиотека уже загружена, но мы вызываем после рендера
    window.generatePdfWithJsPDF = generatePdfWithJsPDF;

    // обработчики кнопок
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // инициализация
    function init() {
        currentIndex = 0;
        userAnswers.fill(null);
        quizFinished = false;
        questionCardDiv.style.display = 'block';
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        resultContainer.style.display = 'none';
        resultContainer.innerHTML = '';
        renderCurrentQuestion();
        updateProgressAndCounter();
    }
    init();
</script>
</body>
</html>
